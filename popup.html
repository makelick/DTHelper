<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>DT Helper</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      margin: 0;
      padding: 16px;
      min-width: 280px;
    }

    h2 {
      margin: 0 0 12px 0;
      font-size: 14px;
      font-weight: 600;
    }

    label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
    }

    .sub-option {
      margin-left: 26px;
      margin-top: 8px;
    }

    .sub-option label {
      color: #666;
    }

    .sub-option.disabled label {
      color: #999;
      cursor: not-allowed;
    }

    .sub-option.disabled input {
      cursor: not-allowed;
    }

    code {
      font-size: 11px;
      background: #eee;
      padding: 1px 4px;
      border-radius: 3px;
    }

    .debug-option {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #eee;
    }

    .debug-option label {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .debug-hint {
      margin: 6px 0 0 26px;
      font-size: 11px;
      color: #666;
    }
  </style>
</head>

<body>
  <h2>DT Helper</h2>
  <label>
    <input type="checkbox" id="showCard" checked>
    <span>Show liquidity card</span>
  </label>
  <div class="sub-option" id="subOption">
    <label>
      <input type="checkbox" id="expanded" checked>
      <span>Show card expanded by default</span>
    </label>
  </div>
  <div class="debug-option">
    <label>
      <input type="checkbox" id="debugLog">
      <span>Enable debug logging</span>
    </label>
  </div>
  <script src="popup.js"></script>
</body>

</html>
