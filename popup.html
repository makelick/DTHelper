<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>DT Helper</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <h2>DT Helper</h2>
  <label>
    <input type="checkbox" id="showCard" checked>
    <span>Show liquidity card</span>
  </label>
  <div class="sub-option" id="subOption">
    <label>
      <input type="checkbox" id="expanded" checked>
      <span>Show card expanded by default</span>
    </label>
  </div>
  <div class="debug-option">
    <label>
      <input type="checkbox" id="debugLog">
      <span>Enable debug logging</span>
    </label>
  </div>
  <script src="popup.js"></script>
</body>

</html>
