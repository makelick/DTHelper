<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>DT Helper</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      margin: 0;
      padding: 16px;
      min-width: 280px;
    }
    h2 {
      margin: 0 0 12px 0;
      font-size: 14px;
      font-weight: 600;
    }
    label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
    }
    p {
      margin: 0 0 8px 0;
      color: #666;
    }
  </style>
</head>
<body>
  <h2>DT Helper</h2>
  <label>
    <input type="checkbox" id="expanded" checked>
    <span>Show liquidity card expanded by default</span>
  </label>
  <script src="popup.js"></script>
</body>
</html>
